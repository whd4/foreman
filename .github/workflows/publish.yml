# Publish to npm from GitHub, with no token stored anywhere.
#
# This uses npm's trusted publishing (OIDC): npm is configured to trust THIS repository
# and THIS workflow, and mints a short-lived credential at publish time. Nothing
# long-lived sits on a laptop or in repository secrets, so there is no token to leak,
# rotate, or lose. It also means a release does not depend on whichever machine happens
# to be logged in.
#
# ── one-time setup, on npmjs.com ────────────────────────────────────────────────
# The package must exist before it can be configured, so the FIRST publish is manual.
# After that:
#   1. https://www.npmjs.com/package/@whd4/foreman/access
#   2. Trusted publisher -> GitHub Actions
#   3. Organization or user: whd4
#      Repository:          foreman
#      Workflow filename:   publish.yml
#      Environment:         (leave blank)
# From then on every release runs from here.
#
# ── releasing ───────────────────────────────────────────────────────────────────
#   git tag v0.5.1 && git push origin v0.5.1
# Or run it by hand from the Actions tab.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write        # required for OIDC; without it npm cannot mint the credential

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # No dependencies to install — the package ships zero. `npm ci` would fail without
      # a lockfile, so the test suite runs directly against Node's built-in runner.
      - name: Test
        run: node --test "test/**/*.test.js"

      # Refuse to publish a tag that disagrees with package.json. Getting these out of
      # step produces a version on npm that matches no commit, which is unpickable apart
      # later.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      # Show exactly what would go out before it goes out.
      - name: Pack preview
        run: npm pack --dry-run

      # Trusted publishing cannot be configured until the package exists, so the FIRST
      # release falls back to a token in repository secrets. Add one at
      # Settings -> Secrets and variables -> Actions -> New secret, named NPM_TOKEN
      # (npmjs.com -> Access Tokens -> Generate -> Granular, Read and write).
      # Once the package is live and the trusted publisher is configured, delete the
      # secret: OIDC takes over on its own and nothing long-lived remains.
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
